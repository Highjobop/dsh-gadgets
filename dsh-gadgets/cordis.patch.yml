# dsh-gadgets 聚合包：向 web 组合树插入三个子插件的加载行。
# 三个子包作为本包依赖由 pnpm 一并装入 profile node_modules（profile 模板 nodeLinker: hoisted，
# 传递依赖也在根目录），Loader 按 name 解析即可命中。单独安装子包时由其自身的自插 patch 生效，
# 两种方式二选一，不要混装（会重复插入同名行）。
- insert:
    - id: dsh-skin
      name: dsh-skin
    - id: dsh-tidy
      name: dsh-tidy
    - id: dsh-task-alerts
      name: dsh-task-alerts
